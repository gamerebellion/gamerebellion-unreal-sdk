[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; The native GameRebellion.Core.* libraries for every platform, plus the shared C
; header (PublicIncludePaths in Build.cs) and the Android UPL. BuildPlugin does NOT
; include ThirdParty/ by default -- without this, packaged plugins dlopen-fail at
; runtime (Win64/Linux/Mac/Android) or fail to link at all (iOS, which statically
; links these .a files at compile time).
/ThirdParty/...
/README.md
